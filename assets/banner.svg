<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="384" viewBox="0 0 1280 384" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#10141c"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <radialGradient id="glowBlue">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple">
      <stop offset="0" stop-color="#8957e5" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8957e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1280" height="384" fill="url(#bg)"/>
  <rect width="1280" height="384" fill="url(#grid)"/>

  <circle cx="290" cy="60" r="230" fill="url(#glowBlue)" filter="url(#soft)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1010" cy="300" r="260" fill="url(#glowPurple)" filter="url(#soft)">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="9s" repeatCount="indefinite"/>
  </circle>

  <circle cx="200" cy="330" r="2.4" fill="#58a6ff">
    <animate attributeName="cy" values="360;40" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="360" cy="300" r="1.8" fill="#bc8cff">
    <animate attributeName="cy" values="340;50" dur="7.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="7.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1180" cy="80" r="2.2" fill="#3fb950">
    <animate attributeName="cy" values="90;360" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="40" r="1.6" fill="#58a6ff">
    <animate attributeName="cy" values="50;300" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="6.5s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(90 24)">
    <rect width="430" height="196" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect width="430" height="38" rx="12" fill="#21262d"/>
    <rect y="52" width="430" height="4" fill="#21262d"/>
    <circle cx="22" cy="19" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="19" r="6" fill="#ffbd2e"/>
    <circle cx="74" cy="19" r="6" fill="#27c93f"/>
    <text x="214" y="26" font-size="13" fill="#8b949e" text-anchor="middle">othmane — zsh</text>

    <text x="24" y="88" font-size="15" fill="#3fb950" font-family="Consolas, 'SF Mono', monospace">
      ~ $ whoami
    </text>
    <text x="24" y="112" font-size="15" fill="#e6edf3" font-family="Consolas, 'SF Mono', monospace" opacity="0">
      othmane-arrimanius
      <animate attributeName="opacity" values="0;1" begin="0.8s" dur="0.4s" fill="freeze"/>
    </text>
    <text x="24" y="140" font-size="15" fill="#3fb950" font-family="Consolas, 'SF Mono', monospace" opacity="0">
      ~ $ npm run dev
      <animate attributeName="opacity" values="0;1" begin="1.6s" dur="0.4s" fill="freeze"/>
    </text>
    <text x="24" y="164" font-size="15" fill="#8b949e" font-family="Consolas, 'SF Mono', monospace" opacity="0">
      ✓ build complete — ready in 0.42s
      <animate attributeName="opacity" values="0;1" begin="2.4s" dur="0.4s" fill="freeze"/>
    </text>
    <text x="24" y="192" font-size="15" fill="#58a6ff" font-family="Consolas, 'SF Mono', monospace" opacity="0">
      &#62; building the web, one commit at a time_
      <animate attributeName="opacity" values="0;1" begin="3.2s" dur="0.4s" fill="freeze"/>
    </text>
    <rect x="24" y="193" width="9" height="3" fill="#e6edf3" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="3.2s" dur="0.4s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="3.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(560 78)" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.2s" dur="0.6s" fill="freeze"/>
    <animate attributeName="transform" type="translate" values="560 96;560 78" begin="0.2s" dur="0.6s" fill="freeze"/>
    <text x="0" y="0" font-size="52" font-weight="700" fill="#e6edf3">Othmane </text>
    <text x="0" y="52" font-size="52" font-weight="700" fill="url(#nameGrad)">Amjahdi</text>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="1.1s" dur="0.5s" fill="freeze"/>
      <text x="4" y="96" font-size="21" fill="#8b949e">Full-Stack Developer</text>
      <text x="4" y="126" font-size="21" fill="#8b949e">Build. Learn. Ship. Repeat.</text>
    </g>

    <g font-size="14" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="1.9s" dur="0.5s" fill="freeze"/>
      <rect x="0" y="148" width="86" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
      <text x="43" y="167" fill="#e6edf3" text-anchor="middle">Full-Stack</text>
      <rect x="94" y="148" width="58" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
      <text x="123" y="167" fill="#e6edf3" text-anchor="middle">AI</text>
      <rect x="160" y="148" width="62" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
      <text x="191" y="167" fill="#e6edf3" text-anchor="middle">SaaS</text>
      <rect x="230" y="148" width="112" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
      <text x="286" y="167" fill="#e6edf3" text-anchor="middle">E-commerce</text>
      <rect x="350" y="148" width="98" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
      <text x="399" y="167" fill="#e6edf3" text-anchor="middle">Morocco 🇲🇦</text>
    </g>
  </g>

  <g>
    <rect x="90" y="352" width="1100" height="5" rx="2.5" fill="#21262d"/>
    <rect x="90" y="352" width="0" height="5" rx="2.5" fill="url(#nameGrad)">
      <animate attributeName="width" values="0;1100" dur="3.5s" begin="2.5s" fill="freeze"/>
    </rect>
  </g>
</svg>